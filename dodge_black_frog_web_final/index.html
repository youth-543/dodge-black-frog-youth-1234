<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>躲避黑蛙</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<style id="mobile-web-shell">
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

#canvas {
    display: block;
}

/* 引擎初始化时给 canvas 内联了 position:absolute;top:0;left:0，flex 居中对它无效。
   仅触屏设备（JS 会给 html 加 touch-shell 类）用 !important 抵消顶对齐，让 16:9
   矩形在竖屏黑边中真正居中。transform 会被 getBoundingClientRect 计入，触摸坐标依旧准确；
   PC 不加该类，布局与原来完全一致 */
html.touch-shell #canvas {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%);
}

/* 非拦截式横屏提示：只在竖屏触屏时出现在顶部黑边区，绝不遮挡或隐藏 canvas */
#ori-tip {
    position: fixed;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    z-index: 50;
    display: none;
    align-items: center;
    gap: 10px;
    max-width: 92vw;
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    background: rgba(10, 14, 24, 0.85);
    border: 1px solid rgba(120, 160, 255, 0.35);
    color: #d6e2ff;
    font: 13px/1.2 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    white-space: nowrap;
    pointer-events: auto;
}

#ori-tip.show {
    display: flex;
}

#ori-tip button {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    color: #fff;
    background: #3567c4;
}

#ori-tip .ori-close {
    background: transparent;
    color: #9fb2d8;
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
}
</style>

</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="ori-tip">
			<span>横屏体验更佳，竖屏也可直接玩</span>
			<button id="ori-go" type="button">尝试横屏</button>
			<button id="ori-close" class="ori-close" type="button" aria-label="关闭">×</button>
		</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
/* 《躲避黑蛙》Web 外壳移动端适配（只在本文件，不涉及游戏本体）：
 * 1) 触屏设备：把引擎读取到的窗口尺寸限制为屏幕内最大的 16:9 矩形（contain），
 *    竖屏时画面完整居中、上下黑边，照常可玩；用户横持手机时自动铺满。
 *    引擎（canvasResizePolicy=2）只用 window.innerWidth/innerHeight 决定画布大小，
 *    且触摸坐标统一用 getBoundingClientRect() 换算，所以改写这两个值即可，输入依旧准确。
 * 2) 非触屏（PC）不改写任何东西，行为与原来完全一致。
 * 3) 首次触摸或点「尝试横屏」时静默尝试全屏 + 锁横屏；不支持就忽略，绝不阻止进入游戏。
 * 4) 顶部提示条只在竖屏触屏显示，可关闭，绝不隐藏 canvas。
 *    URL 带 force_touch 仅用于本地自动化验证，真实用户无需使用。 */
(function () {
	var isTouch = location.search.indexOf('force_touch') !== -1 ||
		(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
		'ontouchstart' in window;
	if (!isTouch) { return; }

	/* 注意：Chromium 系（含安卓 X5/系统 WebView）innerWidth/Height 是 window 实例自身的
	 * 访问器，写在 Window.prototype 上会被遮蔽；必须取实例描述符后在实例层覆盖。
	 * Firefox 上实例描述器不存在，则回退取原型上的原生 getter，再在实例层定义，效果一致 */
	var dW = Object.getOwnPropertyDescriptor(window, 'innerWidth') ||
		Object.getOwnPropertyDescriptor(Window.prototype, 'innerWidth');
	var dH = Object.getOwnPropertyDescriptor(window, 'innerHeight') ||
		Object.getOwnPropertyDescriptor(Window.prototype, 'innerHeight');

	function physW() {
		return document.documentElement.clientWidth || (dW ? dW.get.call(window) : screen.width);
	}
	function physH() {
		return document.documentElement.clientHeight || (dH ? dH.get.call(window) : screen.height);
	}
	/* 屏内最大的 16:9 矩形：竖屏以宽为准，横屏以高为准 */
	function gameBox() {
		var w = physW();
		var h = Math.round(w * 9 / 16);
		if (h > physH() || h < 1) {
			h = physH();
			w = Math.round(h * 16 / 9);
		}
		return { w: Math.max(1, w), h: Math.max(1, h) };
	}
	try {
		Object.defineProperty(window, 'innerWidth', { configurable: true, get: function () { return gameBox().w; } });
		Object.defineProperty(window, 'innerHeight', { configurable: true, get: function () { return gameBox().h; } });
	} catch (e) { return; }
	/* 仅触屏设备启用 canvas 居中 CSS（PC DOM 不加该类，行为零变化） */
	document.documentElement.classList.add('touch-shell');

	/* 部分 X5 / WebView 旋转或工具栏伸缩时只发 visualViewport 事件，补一次 resize 转发给引擎 */
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', function () {
			window.dispatchEvent(new Event('resize'));
		});
	}
	window.addEventListener('orientationchange', function () {
		window.dispatchEvent(new Event('resize'));
	});

	/* —— 非拦截式提示条 —— */
	var tip = document.getElementById('ori-tip');
	var DISMISS_KEY = 'dbf_ori_tip_closed';
	function tipDismissed() {
		try { return localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
	}
	function refreshTip() {
		if (!tip) { return; }
		var portrait = physH() > physW();
		if (portrait && !tipDismissed()) { tip.classList.add('show'); }
		else { tip.classList.remove('show'); }
	}
	window.addEventListener('resize', refreshTip);
	window.addEventListener('orientationchange', refreshTip);
	refreshTip();
	var closeBtn = document.getElementById('ori-close');
	if (closeBtn) {
		closeBtn.addEventListener('click', function () {
			try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
			refreshTip();
		});
	}
	var goBtn = document.getElementById('ori-go');
	if (goBtn) { goBtn.addEventListener('click', tryLandscape); }

	/* —— 尽力横屏：能锁就锁，不能锁静默失败；任何情况下不拦截游戏 —— */
	var lockTried = false;
	function lockLandscape() {
		try {
			var o = screen.orientation;
			if (o && typeof o.lock === 'function') {
				var r = o.lock('landscape');
				if (r && typeof r.catch === 'function') { r.catch(function () {}); }
			}
		} catch (e) {}
	}
	function tryLandscape() {
		if (lockTried) { return; }
		lockTried = true;
		try {
			var el = document.documentElement;
			var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
			if (typeof req === 'function') {
				var p = req.call(el);
				if (p && typeof p.then === 'function') { p.then(lockLandscape)['catch'](function () {}); }
				else { lockLandscape(); }
			}
		} catch (e) {}
	}
	document.addEventListener('fullscreenchange', lockLandscape);
	document.addEventListener('webkitfullscreenchange', lockLandscape);
	/* 第一次触摸（用户手势）时尽力试一次；capture 阶段，点在游戏画面上也收得到 */
	function onFirstGesture() {
		window.removeEventListener('pointerdown', onFirstGesture, true);
		window.removeEventListener('touchstart', onFirstGesture, true);
		tryLandscape();
	}
	window.addEventListener('pointerdown', onFirstGesture, { capture: true, passive: true });
	window.addEventListener('touchstart', onFirstGesture, { capture: true, passive: true });
})();
		</script>
		<script>
const GODOT_CONFIG ={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8046640,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
