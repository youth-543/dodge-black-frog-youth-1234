<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>躲避黑蛙</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<style id="mobile-web-shell">
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

#canvas {
    display: block;
}

/* 引擎初始化时给 canvas 内联了 position:absolute;top:0;left:0，flex 居中对它无效。
   仅触屏设备（JS 会给 html 加 touch-shell 类）用 !important 抵消顶对齐，让 16:9
   矩形在竖屏黑边中真正居中。transform 会被 getBoundingClientRect 计入，触摸坐标依旧准确；
   PC 不加该类，布局与原来完全一致 */
html.touch-shell #canvas {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%);
}

/* 非拦截式横屏提示：只在竖屏触屏时出现在顶部黑边区，绝不遮挡或隐藏 canvas */
#ori-tip {
    position: fixed;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    z-index: 50;
    display: none;
    align-items: center;
    gap: 10px;
    max-width: 92vw;
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    background: rgba(10, 14, 24, 0.85);
    border: 1px solid rgba(120, 160, 255, 0.35);
    color: #d6e2ff;
    font: 13px/1.2 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    white-space: nowrap;
    pointer-events: auto;
}

#ori-tip.show {
    display: flex;
}

#ori-tip button {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    color: #fff;
    background: #3567c4;
}

#ori-tip .ori-close {
    background: transparent;
    color: #9fb2d8;
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
}

/* 横屏尝试失败后的引导态：允许文案换行（仍不遮挡 canvas 交互区） */
#ori-tip.guide {
    white-space: normal;
    border-radius: 12px;
}

#ori-tip.guide #ori-text {
    white-space: normal;
}

/* 诊断面板：仅 URL 带 ?dbg=ori 时由 JS 创建，用于真机排查，正式用户看不到 */
#ori-dbg {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    display: flex;
    flex-direction: column;
    max-height: 46vh;
    font: 10px/1.45 ui-monospace, Menlo, Consolas, monospace;
    color: #9fe6c0;
    background: rgba(0, 0, 0, 0.84);
    border-top: 1px solid #3a9;
}

#ori-dbg-bar {
    display: flex;
    justify-content: space-between;
    padding: 3px 8px;
    color: #cdf2ff;
    background: #10202e;
}

#ori-dbg-clear {
    cursor: pointer;
    color: #ffd58a;
}

#ori-dbg-log {
    margin: 0;
    padding: 4px 8px;
    overflow: auto;
    max-height: 38vh;
    white-space: pre-wrap;
    word-break: break-all;
}
</style>

</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="ori-tip">
			<span id="ori-text">横屏体验更佳，竖屏也可直接玩</span>
			<button id="ori-go" type="button">尝试横屏</button>
			<button id="ori-close" class="ori-close" type="button" aria-label="关闭">×</button>
		</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
/* 《躲避黑蛙》Web 外壳移动端适配（只在本文件，不涉及游戏本体）：
 * 1) 触屏设备：把引擎读取到的窗口尺寸限制为屏幕内最大的 16:9 矩形（contain），
 *    竖屏时画面完整居中、上下黑边，照常可玩；用户横持手机时自动铺满。
 *    引擎（canvasResizePolicy=2）只用 window.innerWidth/innerHeight 决定画布大小，
 *    且触摸坐标统一用 getBoundingClientRect() 换算，所以改写这两个值即可，输入依旧准确。
 * 2) 非触屏（PC）不改写任何东西，行为与原来完全一致。
 * 3) 横屏只在用户点「尝试横屏」时发起（手势内直接锁 + 全屏后再锁，各路径独立记录结果）；
 *    不支持就降级为手动横持引导，绝不阻止进入游戏、绝不隐藏 canvas。
 * 4) 顶部提示条只在竖屏触屏显示，可关闭，绝不隐藏 canvas。
 *    URL 带 force_touch 仅用于本地自动化验证；带 dbg=ori 显示横屏诊断面板，真机排查用。 */
(function () {
	var isTouch = location.search.indexOf('force_touch') !== -1 ||
		(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
		'ontouchstart' in window;
	if (!isTouch) { return; }

	/* 注意：Chromium 系（含安卓 X5/系统 WebView）innerWidth/Height 是 window 实例自身的
	 * 访问器，写在 Window.prototype 上会被遮蔽；必须取实例描述符后在实例层覆盖。
	 * Firefox 上实例描述器不存在，则回退取原型上的原生 getter，再在实例层定义，效果一致 */
	var dW = Object.getOwnPropertyDescriptor(window, 'innerWidth') ||
		Object.getOwnPropertyDescriptor(Window.prototype, 'innerWidth');
	var dH = Object.getOwnPropertyDescriptor(window, 'innerHeight') ||
		Object.getOwnPropertyDescriptor(Window.prototype, 'innerHeight');

	function physW() {
		return document.documentElement.clientWidth || (dW ? dW.get.call(window) : screen.width);
	}
	function physH() {
		return document.documentElement.clientHeight || (dH ? dH.get.call(window) : screen.height);
	}
	/* 屏内最大的 16:9 矩形：竖屏以宽为准，横屏以高为准 */
	function gameBox() {
		var w = physW();
		var h = Math.round(w * 9 / 16);
		if (h > physH() || h < 1) {
			h = physH();
			w = Math.round(h * 16 / 9);
		}
		return { w: Math.max(1, w), h: Math.max(1, h) };
	}
	try {
		Object.defineProperty(window, 'innerWidth', { configurable: true, get: function () { return gameBox().w; } });
		Object.defineProperty(window, 'innerHeight', { configurable: true, get: function () { return gameBox().h; } });
	} catch (e) { return; }
	/* 仅触屏设备启用 canvas 居中 CSS（PC DOM 不加该类，行为零变化） */
	document.documentElement.classList.add('touch-shell');

	/* 部分 X5 / WebView 旋转或工具栏伸缩时只发 visualViewport 事件，补一次 resize 转发给引擎 */
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', function () {
			window.dispatchEvent(new Event('resize'));
		});
	}
	window.addEventListener('orientationchange', function () {
		window.dispatchEvent(new Event('resize'));
	});

	/* —— 诊断日志：?dbg=ori 时在页面底部显示，并同步 console —— */
	var DBG = location.search.indexOf('dbg=ori') !== -1;
	var dbgPre = null;
	var logLines = [];
	function dbg(tag, detail) {
		var line = new Date().toLocaleTimeString('zh-CN', { hour12: false }) + ' [' + tag + '] ' + detail;
		logLines.push(line);
		if (logLines.length > 60) { logLines.shift(); }
		if (dbgPre) {
			dbgPre.textContent = logLines.join('\n');
			dbgPre.scrollTop = dbgPre.scrollHeight;
		}
		try { console.log('[ori]', tag, detail); } catch (e) {}
	}
	function orientType() {
		var o = screen.orientation;
		return (o && o.type) ? o.type : 'n/a';
	}
	if (DBG) {
		var panel = document.createElement('div');
		panel.id = 'ori-dbg';
		panel.innerHTML = '<div id="ori-dbg-bar"><b>ORI 诊断（?dbg=ori）</b><span id="ori-dbg-clear">清空</span></div>' +
			'<pre id="ori-dbg-log"></pre>';
		document.body.appendChild(panel);
		dbgPre = document.getElementById('ori-dbg-log');
		document.getElementById('ori-dbg-clear').addEventListener('click', function () {
			logLines = [];
			dbgPre.textContent = '';
		});
		/* 能力快照：只看 API 是否存在，不用 UA 推断；UA 仅作为排查信息记录 */
		var el0 = document.documentElement;
		dbg('CAP', 'UA=' + navigator.userAgent);
		dbg('CAP', 'secureContext=' + window.isSecureContext +
			' isWeChat=' + /MicroMessenger/i.test(navigator.userAgent) +
			' isMQQ=' + (/QQ\//i.test(navigator.userAgent) || /QHBrowser/i.test(navigator.userAgent)));
		dbg('CAP', 'pointerCoarse=' + (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) +
			' ontouchstart=' + ('ontouchstart' in window));
		dbg('CAP', 'fullscreenEnabled=' + document.fullscreenEnabled +
			' webkitFullscreenEnabled=' + document.webkitFullscreenEnabled);
		dbg('CAP', 'requestFullscreen=' + typeof el0.requestFullscreen +
			' webkitRequestFullscreen=' + typeof el0.webkitRequestFullscreen +
			' webkitRequestFullScreen=' + typeof el0.webkitRequestFullScreen);
		dbg('CAP', 'orientation.type=' + orientType() +
			' orientation.lock=' + (screen.orientation && typeof screen.orientation.lock));
		window.addEventListener('unhandledrejection', function (ev) {
			var r = ev.reason;
			dbg('REJECT', (r && (r.name + ' ' + r.message)) || String(r));
		});
	}
	window.addEventListener('orientationchange', function () {
		dbg('EVENT', 'orientationchange -> ' + orientType() + ' phys=' + physW() + 'x' + physH());
	});

	/* —— 非拦截式提示条 —— */
	var tip = document.getElementById('ori-tip');
	var tipText = document.getElementById('ori-text');
	var TIP_DEFAULT = '横屏体验更佳，竖屏也可直接玩';
	var DISMISS_KEY = 'dbf_ori_tip_closed';
	var forceHint = false;  /* 横屏尝试失败后临时强制展示引导；横屏或手动关闭后清除 */
	/* 关闭状态只保留在当前页面会话（sessionStorage）：刷新当前标签仍生效，
	 * 但用户重新打开链接/新开页面时提示条会再次出现，横屏入口永不丢失。
	 * 同时清掉旧版本写在 localStorage 里的永久关闭标记 */
	try { localStorage.removeItem(DISMISS_KEY); } catch (e) {}
	function tipDismissed() {
		try { return sessionStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
	}
	function refreshTip() {
		if (!tip) { return; }
		var portrait = physH() > physW();
		if (portrait && (forceHint || !tipDismissed())) { tip.classList.add('show'); }
		else { tip.classList.remove('show'); }
	}
	window.addEventListener('resize', refreshTip);
	window.addEventListener('orientationchange', refreshTip);
	refreshTip();
	var closeBtn = document.getElementById('ori-close');
	if (closeBtn) {
		closeBtn.addEventListener('click', function () {
			forceHint = false;
			tip.classList.remove('guide');
			if (tipText) { tipText.textContent = TIP_DEFAULT; }
			try { sessionStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
			refreshTip();
		});
	}

	/* —— 横屏能力层：全屏 / 锁方向，所有分支独立记录结果，不靠 UA 判断能力 —— */
	var busy = false;            /* 一次点击的完整尝试周期（约 1.3s），期间防并发 */
	var attemptSeq = 0;
	var postLockState = 'none'; /* 进入全屏后的锁定只执行一次：none/pending/ok/fail */

	function getFsElement() {
		return document.fullscreenElement || document.webkitFullscreenElement ||
			document.mozFullScreenElement || document.msFullscreenElement || null;
	}
	function isLandscapePhys() {
		var t = orientType();
		if (t.indexOf('landscape') !== -1) { return true; }
		if (t.indexOf('portrait') !== -1) { return false; }
		/* 个别 WebView 没有 orientation.type：用物理尺寸兜底 */
		return physW() >= physH();
	}
	function requestFullscreenNow() {
		var el = document.documentElement;
		var req = el.requestFullscreen || el.webkitRequestFullscreen ||
			el.webkitRequestFullScreen || el.msRequestFullscreen;
		if (typeof req !== 'function') {
			var e1 = new Error('NO_FULLSCREEN_API');
			e1.name = 'NotSupportedError';
			return Promise.reject(e1);
		}
		try {
			var p = req.call(el);
			if (p && typeof p.then === 'function') { return p; }
			/* 旧 webkit 实现可能无返回值：是否成功由 fullscreenchange 事件判定 */
			return Promise.resolve();
		} catch (e) { return Promise.reject(e); }
	}
	/* 进入全屏后的锁定：事件回调和 promise 回调谁先触发谁执行，只执行一次；
	 * 不假设任何一条路径一定可用，成功/失败都记录 */
	function postLockOnce(tag) {
		if (postLockState !== 'none') {
			dbg('LOCK:' + tag, '跳过（post-lock 已尝试，状态=' + postLockState + '）');
			return;
		}
		postLockState = 'pending';
		var o = screen.orientation;
		if (!o || typeof o.lock !== 'function') {
			postLockState = 'fail';
			dbg('LOCK:' + tag, '无 screen.orientation.lock API');
			return;
		}
		dbg('LOCK:' + tag, '调用 lock("landscape")，调用前=' + o.type);
		var r;
		try { r = o.lock('landscape'); }
		catch (e) {
			postLockState = 'fail';
			dbg('LOCK:' + tag, '同步异常 ' + e.name + ' ' + e.message);
			return;
		}
		if (r && typeof r.then === 'function') {
			r.then(function () {
				postLockState = 'ok';
				dbg('LOCK:' + tag, 'resolve 成功，当前=' + o.type);
			}, function (e) {
				postLockState = 'fail';
				dbg('LOCK:' + tag, 'reject ' + (e && e.name) + ' ' + (e && e.message));
			});
		} else {
			dbg('LOCK:' + tag, '同步无 Promise，视为已受理');
		}
	}
	function onFsChange() {
		var el = getFsElement();
		dbg('EVENT', 'fullscreenchange fsEl=' + (el ? (el.tagName + ':有') : '无') +
			' orient=' + orientType() + ' postLock=' + postLockState);
		/* 只有用户点击发起的尝试周期内，才借事件补锁；引擎启动时自己的全屏不参与 */
		if (el && busy) { postLockOnce('fs-event'); }
	}
	document.addEventListener('fullscreenchange', onFsChange);
	document.addEventListener('webkitfullscreenchange', onFsChange);
	document.addEventListener('mozfullscreenchange', onFsChange);
	if (document.addEventListener) { document.addEventListener('MSFullscreenChange', onFsChange); }

	/* UA 只用于选择"失败后说什么话"，绝不用于判断能不能横屏 */
	function hostHint() {
		var ua = navigator.userAgent;
		if (/MicroMessenger/i.test(ua)) {
			return '微信内不支持网页自动横屏，请打开手机「自动旋转」后横持手机，竖屏也可直接玩';
		}
		if (/QQ\//i.test(ua) || /QHBrowser/i.test(ua)) {
			return '如未自动横屏，请打开手机「自动旋转」后横持手机';
		}
		return '该浏览器不支持自动横屏，请横持手机（或用浏览器菜单的全屏/横屏），竖屏也可直接玩';
	}
	/* 点击后观察物理方向最多 1.3 秒；宿主旋转（如 QQ）与 orientation.lock 成功都算成功 */
	function waitForLandscape(seq) {
		return new Promise(function (resolve) {
			var t0 = Date.now();
			(function tick() {
				if (seq !== attemptSeq) { resolve(false); return; }
				if (isLandscapePhys()) { resolve(true); return; }
				if (Date.now() - t0 > 1300) { resolve(false); return; }
				setTimeout(tick, 80);
			})();
		});
	}
	function tryLandscape(source) {
		source = source || 'button';
		if (busy) {
			dbg('BTN:' + source, '上一次尝试仍在进行，忽略本次点击（防并发）');
			return;
		}
		if (isLandscapePhys()) {
			dbg('BTN:' + source, '当前已是横屏，无需操作');
			forceHint = false;
			refreshTip();
			return;
		}
		busy = true;
		var seq = ++attemptSeq;
		postLockState = 'none';
		forceHint = false;
		tip.classList.remove('guide');
		if (tipText) { tipText.textContent = TIP_DEFAULT; }
		dbg('BTN:' + source, '开始尝试 #' + seq + ' fsEl=' + (getFsElement() ? '有' : '无') +
			' orient=' + orientType());

		/* 路径 2：仍在同一手势内请求全屏；进入全屏后由事件/promise 补一次锁 */
		var fsStep;
		if (getFsElement()) {
			dbg('FS', '已处于全屏，跳过请求直接尝试锁定');
			fsStep = Promise.resolve();
			postLockOnce('already-fs');
		} else {
			/* 路径 1：用户手势内先直接锁一次（部分浏览器/桌面 Chrome 不要求全屏；
			 * 结果独立记录，失败不影响后续全屏路径。已全屏时不走这条，避免与
			 * already-fs 的 lock 在同一 tick 互相 cancel 产生 AbortError） */
			try {
				var o0 = screen.orientation;
				if (o0 && typeof o0.lock === 'function') {
					var lp;
					try { lp = o0.lock('landscape'); }
					catch (e) { lp = null; dbg('LOCK:gesture', '同步异常 ' + e.name + ' ' + e.message); }
					if (lp && typeof lp.then === 'function') {
						lp.then(function () { dbg('LOCK:gesture', 'resolve 成功 ' + o0.type); },
							function (e) { dbg('LOCK:gesture', 'reject ' + e.name + ' ' + e.message); });
					}
				} else {
					dbg('LOCK:gesture', '无 orientation.lock API');
				}
			} catch (e) { dbg('LOCK:gesture', '异常 ' + e.name); }

			fsStep = requestFullscreenNow().then(function () {
				dbg('FS', 'requestFullscreen resolve，fsEl=' + (getFsElement() ? '有' : '无'));
				postLockOnce('afterFs');
			}, function (e) {
				dbg('FS', 'requestFullscreen reject ' + (e && e.name) + ' ' + (e && e.message));
			});
		}
		fsStep.then(function () { return waitForLandscape(seq); }).then(function (ok) {
			busy = false;
			dbg('RESULT#' + seq, ok
				? '已进入横屏（锁定成功或宿主跟随旋转）'
				: '仍为竖屏：保留 16:9 等比适配，游戏照常可玩，给出手动引导');
			if (ok) {
				forceHint = false;
			} else {
				forceHint = true;
				tip.classList.add('guide');
				if (tipText) { tipText.textContent = hostHint(); }
			}
			refreshTip();
		});
	}

	var goBtn = document.getElementById('ori-go');
	if (goBtn) { goBtn.addEventListener('click', function () { tryLandscape('button'); }); }
	/* 注意：不再在"首次任意触摸"时自动尝试——那会提前耗尽本次手势且让按钮看似失灵。
	 * 横屏只由用户明确点击「尝试横屏」发起，每次点击都是独立、可重复的完整尝试。 */
})();

		<script>
const GODOT_CONFIG ={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8046640,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,

	if (missing.length !== 0) {

			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();

			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
